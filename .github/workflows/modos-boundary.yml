name: MODOS Boundary

on:
  push:
    branches:
      - master
      - 'codex/**'
      - 'modos/**'
      - 'governance/**'
  pull_request:

permissions:
  contents: read

jobs:
  promotion-before-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile governance code and tests
        run: |
          python3 -m py_compile \
            scripts/daily_governance.py \
            tests/test_daily_governance.py \
            tests/test_daily_governance_contract.py \
            tests/test_substrate_sync_policy.py
      - name: Validate published JSON contracts
        run: |
          python3 -m json.tool schemas/daily-governance-v1.schema.json >/dev/null
          python3 -m json.tool examples/daily-governance.example.json >/dev/null
      - name: Check sync script syntax
        run: bash -n scripts/substrate-sync.sh
      - name: Test publication and governance policy
        run: python3 -m unittest discover -s tests -v
