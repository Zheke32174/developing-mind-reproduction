name: Apply empirical governance repair

on:
  push:
    branches:
      - governance/evidence-derived-reliability-v1
    paths:
      - '.github/workflows/apply-empirical-governance.yml'
      - 'checkpoints/empirical-governance.patch'

permissions:
  contents: write

concurrency:
  group: apply-empirical-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate empirical scoring repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check checkpoints/empirical-governance.patch
          git apply checkpoints/empirical-governance.patch
          python3 -m py_compile \
            scripts/daily_governance.py \
            tests/test_daily_governance_evidence.py \
            tests/test_daily_governance_empirical.py \
            tests/test_daily_governance_contract.py \
            tests/test_substrate_sync_policy.py
          python3 tests/test_substrate_sync_policy.py
          python3 -m unittest discover -s tests -p 'test_daily_governance*.py' -v
          python3 -m json.tool schemas/daily-governance-v1.schema.json >/dev/null
          python3 -m json.tool examples/daily-governance.example.json >/dev/null
          git diff --check
      - name: Commit permanent implementation only
        shell: bash
        run: |
          set -euo pipefail
          git rm checkpoints/empirical-governance.patch .github/workflows/apply-empirical-governance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/daily_governance.py
          git commit -m 'fix: derive governance reliability from empirical traces'
          git push origin "HEAD:${{ github.ref_name }}"
